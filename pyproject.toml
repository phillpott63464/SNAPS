[project]
name = "snaps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.8.*"
dependencies = [
    "bio",
    "blue",
    "bokeh",
    "containers",
    "dataclasses>=0.8",
    "numpy",
    "pandas",
    "pandas-stubs~=2.0.3",
    "plotnine",
    "pydantic>=2.10.6",
    "pynmrstar",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff",
    "scipy",
    "setuptools",
    "snakeviz>=2.2.1",
    "sorted",
    "sortedcontainers",
    "tabulate",
    "typer>=0.20.1",
    "typing-extensions>=4.13.2",
]

[project.scripts]
snaps = "refactor.SNAPS:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
