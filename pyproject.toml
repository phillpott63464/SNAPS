[project]
name = "snaps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
    "bio",
    "blue",
    "bokeh; python_version < '3.15'",
    "bokeh>=3.7,<3.8; python_version >= '3.15'",
    "bokeh-sampledata; python_version >= '3.15'",
    "contourpy>=1.3.3; python_version >= '3.15'",
    "containers",
    "dataclasses>=0.8",
    "numpy<2; python_version < '3.14'",
    "numpy>=2,<2.5; python_version >= '3.14'",
    "pandas; python_version < '3.12'",
    "pandas>=2.1,<3; python_version >= '3.12'",
    "matplotlib>=3.10; python_version >= '3.15'",
    "pillow>=11.3; python_version >= '3.14'",
    "pandas-stubs~=2.0.3",
    "plotnine",
    "pydantic>=2.10.6; python_version < '3.14'",
    "pydantic>=2.12; python_version >= '3.14'",
    "pynmrstar",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff",
    "scipy; python_version < '3.13'",
    "scipy>=1.14,<1.18; python_version >= '3.13' and python_version < '3.15'",
    "scipy>=1.18; python_version >= '3.15'",
    "statsmodels>=0.15; python_version >= '3.15'",
    "setuptools",
    "snakeviz>=2.2.1",
    "sorted",
    "sortedcontainers",
    "tabulate",
    "typer>=0.20.1",
    "typing-extensions>=4.13.2",
]

[project.scripts]
snaps = "refactor.SNAPS:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
