name: SNAPS

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
  schedule:
    # Run roughly every 15 days at 00:00 UTC
    - cron: "0 0 1,16 * *"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11", "3.10", "3.9", "3.8"]
        os: [ubuntu-latest, macos-latest]
        exclude:
          - python-version: "3.8"
            os: ubuntu-latest
          - python-version: "3.9"
            os: ubuntu-latest
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.9"
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SNAPS from source
        run: uv sync

      - name: Run SNAPS tests
        run: uv run pytest -v
